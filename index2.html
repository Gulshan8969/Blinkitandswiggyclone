<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Swiggy Clone</title>
  <link rel="stylesheet" href="style2.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="logo">🧡 Swiggy</div>
    <div class="nav-link">Swiggy Corporate</div>
    <div class="nav-link">Partner with us</div>
    <div class="app-btn">Get the App ↗</div>
    <div class="signin-btn">Sign in</div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-left">🥬 🍅 🌽 🥕</div>

    <div class="hero-center">
      <h1>Order food &amp; groceries. Discover best restaurants. Swiggy it!</h1>

      <div class="search-row">
        <div class="location-box">
          <span>📍</span>
          <input type="text" placeholder="Enter your delivery location">
          <span>⌄</span>
        </div>

        <div class="search-box">
          <input type="text" placeholder="Search for restaurant, item or more">
          <span>🔍</span>
        </div>
      </div>
    </div>

    <div class="hero-right">🍣 🍱 🥢</div>
  </section>

  <!-- Service Cards -->
  <section class="cards">

    <div class="card">
      <h2>FOOD DELIVERY</h2>
      <h3>FROM RESTAURANTS</h3>
      <p class="offer">UPTO 60% OFF</p>
      <div class="card-bottom">
        <div class="arrow">➜</div>
        <div class="card-emoji">🍳</div>
      </div>
    </div>

    <div class="card">
      <h2>INSTAMART</h2>
      <h3>INSTANT GROCERY</h3>
      <p class="offer">UPTO 60% OFF</p>
      <div class="card-bottom">
        <div class="arrow">➜</div>
        <div class="card-emoji">🧺</div>
      </div>
    </div>

    <div class="card">
      <h2>DINEOUT</h2>
      <h3>EAT OUT &amp; SAVE MORE</h3>
      <p class="offer">UPTO 50% OFF</p>
      <div class="card-bottom">
        <div class="arrow">➜</div>
        <div class="card-emoji">🍽️</div>
      </div>
    </div>

  </section>

</body>
</html>
